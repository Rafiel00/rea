# One-off job: vendors the exact published rea-agents package into plugins/rea.
# It exists only on the self-contained-marketplace branch and is deleted right
# after it succeeds. It runs from a push to this branch that touches this file.
name: Vendor rea plugin (one-off)

on:
  push:
    branches: [self-contained-marketplace]
    paths: [.github/workflows/vendor-rea-plugin.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.repository == 'Rafiel00/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Vendor rea-agents into plugins/rea
        env:
          VERSION: "6.10.1"
          INTEGRITY: "sha512-3AWrfFEXppvC98FWhZR2Tzulnqs5xJQrSKmAub6+QME/I58Pr3h8pHqqwM30z2DvlnIx/8Hsu8woMngfi4SNyg=="
        run: |
          set -euo pipefail

          # 1. Download the exact release and verify it against the pinned integrity.
          work="$(mktemp -d)"
          (cd "$work" && npm pack "rea-agents@${VERSION}" --silent >/dev/null)
          actual="sha512-$(openssl dgst -sha512 -binary "$work/rea-agents-${VERSION}.tgz" | base64 -w0)"
          if [ "$actual" != "$INTEGRITY" ]; then
            echo "integrity mismatch: got $actual" >&2
            exit 1
          fi
          tar -xzf "$work/rea-agents-${VERSION}.tgz" -C "$work"

          # 2. Place it unchanged at plugins/rea.
          rm -rf plugins/rea
          mkdir -p plugins
          mv "$work/package" plugins/rea

          # 3. Make git keep every byte: the repo root ignores dist/, build/,
          #    node_modules and .vscode/, and normalizes line endings.
          printf '%s\n' \
            '# Vendored copy of the published rea-agents package (see ../../.claude-plugin/marketplace.json).' \
            '# The repo-root .gitignore excludes dist/, build/, node_modules and .vscode/; this plugin ships' \
            '# them on purpose, so re-include everything below this directory.' \
            '!*' > plugins/rea/.gitignore
          printf '%s\n' \
            '# Keep every vendored byte identical to the published npm tarball (no EOL normalization).' \
            '* -text' > plugins/rea/.gitattributes

          # 4. Sanity checks on the plugin layout.
          test "$(jq -r .name plugins/rea/package.json)" = "rea-agents"
          test "$(jq -r .version plugins/rea/package.json)" = "$VERSION"
          test "$(jq -r .name plugins/rea/.claude-plugin/plugin.json)" = "rea"
          test "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./plugins/rea"
          test -f plugins/rea/dist/mcp/main.js
          test -f plugins/rea/scripts/plugin-mcp-launcher.mjs

          # 5. Stage, then prove nothing was ignored or line-ending-normalized.
          git add plugins/rea
          on_disk="$(find plugins/rea -type f | wc -l)"
          staged="$(git diff --cached --name-only | wc -l)"
          echo "files on disk=${on_disk} staged=${staged}"
          test "$on_disk" = "$staged"
          eol_mismatch="$(git ls-files --eol plugins/rea | awk '{ i=substr($1,3); w=substr($2,3); if (i!=w && i!="" && $1!="i/-text") print }' | wc -l)"
          echo "eol mismatches=${eol_mismatch}"
          test "$eol_mismatch" = "0"

          # 6. Commit and push to this branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(plugin): vendor rea-agents@${VERSION} into plugins/rea" \
            -m "Unmodified contents of the published npm package (sha512 verified), so the marketplace no longer depends on the npm registry."
          git push origin "HEAD:${GITHUB_REF_NAME}"
